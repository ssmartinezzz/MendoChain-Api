[project]
name = "mendochain-api"
version = "0.1.0"
description = "Django REST API for MendoChain: wine traceability on the Algorand blockchain"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dj-database-url~=3.1.2",
    "django~=5.2.17",
    "django-cors-headers~=4.9.0",
    "djangorestframework~=3.18.1",
    "djangorestframework-simplejwt~=5.5.1",
    "gunicorn~=26.2.0",
    "psycopg[binary]~=3.3.6",
    "py-algorand-sdk~=2.12.0",
    "python-dotenv~=1.2.3",
    "whitenoise~=6.12.0",
]

[tool.uv]
package = false
